buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = "https://libraries.minecraft.net" }

        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = 'furry.cool.mc.forge'
version = getProperty("mcVersion") + "-" + getProperty("localVersion")

java {
    archivesBaseName = 'ProjectExpansion'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: getProperty("mappingsChannel"), version: getProperty("mappingsVersion")
    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                projectexpansion {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                projectexpansion {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'projectexpansion', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                projectexpansion {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "projectexpansion.refmap.json"
    config "projectexpansion.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://modmaven.dev/" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "curios"
        url "https://maven.theillusivec4.top/"
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${getProperty("mcVersion")}-${getProperty("forgeVersion")}"
    implementation fg.deobf("curse.maven:projecte-226410:${getProperty("projecteVersion")}")
    implementation "com.mojang:brigadier:1.0.18"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${getProperty("curiosVersion")}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${getProperty("curiosVersion")}")
    compileOnly fg.deobf("mezz.jei:jei-${getProperty("mcVersion")}-common-api:${getProperty("jeiVersion")}")
    compileOnly fg.deobf("mezz.jei:jei-${getProperty("mcVersion")}-forge-api:${getProperty("jeiVersion")}")
    runtimeOnly fg.deobf("mezz.jei:jei-${getProperty("mcVersion")}-forge:${getProperty("jeiVersion")}")
    runtimeOnly fg.deobf("curse.maven:pipez-443900:${getProperty("pipezVersion")}")
    runtimeOnly fg.deobf("curse.maven:ae2-223794:${getProperty("ae2Version")}")
    runtimeOnly fg.deobf("curse.maven:itank-256991:${getProperty("itankVersion")}")
    runtimeOnly fg.deobf("curse.maven:cloth-config-348521:${getProperty("clothVersion")}")
    runtimeOnly fg.deobf("curse.maven:better-advancements-272515:${getProperty("baVersion")}")

    compileOnly fg.deobf("curse.maven:jade-api-324717:${getProperty("jadeApiVersion")}")
    runtimeOnly fg.deobf("curse.maven:jade-324717:${getProperty("jadeVersion")}")

    compileOnly fg.deobf("curse.maven:wthit-455982:${getProperty("wthitVersion")}")
    // runtimeOnly fg.deobf("curse.maven:wthit-455982:${getProperty("wthitVersion")}")
    // runtimeOnly fg.deobf("curse.maven:bad-packets-615134:${getProperty("badPacketsVersion")}")

    // https://github.com/McJtyMods/TheOneProbe/issues/548
    compileOnly fg.deobf("mcjty.theoneprobe:theoneprobe:${getProperty("topVersion")}:api") {
        transitive = false
    }
    // runtimeOnly fg.deobf("mcjty.theoneprobe:theoneprobe:${getProperty("topVersion")}") {
    //     transitive = false
    // }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Project Expansion",
                "Specification-Vendor"    : "Donovan_DMC",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Donovan_DMC",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
