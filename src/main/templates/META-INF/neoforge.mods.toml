modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/WJXhhh/Project-Expansion-Arcanum/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/WJXhhh/Project-Expansion-Arcanum"
logoFile= "icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.21,20)"
ordering = "AFTER"
side = "CLIENT"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "projecte"
type = "required"
versionRange = "${projecte_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ars_nouveau"
type = "optional"
versionRange = "[5.13.3,6)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,6.1)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "goety"
type = "optional"
versionRange = "[3.2.1,3.3)"
ordering = "AFTER"
side = "BOTH"
